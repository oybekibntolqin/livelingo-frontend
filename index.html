<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5B5FE9" />
    <meta
      name="description"
      content="LiveLingo — AI-powered language learning with real people. CEFR exercises, live chat, video calls, and flashcards in 15+ languages."
    />
    <title>LiveLingo — Language Learning, Language Exchange & P2P Video Chat</title>
    <link rel="canonical" href="https://livelingo.uz/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Twitter — this static baseline matters because
         most social-preview bots (Telegram, WhatsApp, Facebook,
         X/Twitter) do NOT execute JavaScript, so they only ever see
         these tags, not the per-route ones set at runtime by
         src/lib/useSEO.ts for /language-learning etc. Search
         engines (Googlebot) DO execute JS and will see the more
         specific per-route tags. This is a known limitation of a
         pure client-rendered SPA with no server-side rendering —
         see the SEO audit notes for details. -->
    <meta property="og:site_name" content="LiveLingo" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LiveLingo — Language Learning, Language Exchange & P2P Video Chat" />
    <meta
      property="og:description"
      content="LiveLingo is a language learning platform for practicing languages with real people through P2P video chat, speaking/reading/writing/listening exercises, and flashcards — in 15+ languages."
    />
    <meta property="og:url" content="https://livelingo.uz/" />
    <meta property="og:image" content="https://livelingo.uz/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LiveLingo — Language Learning, Language Exchange & P2P Video Chat" />
    <meta
      name="twitter:description"
      content="LiveLingo is a language learning platform for practicing languages with real people through P2P video chat, speaking/reading/writing/listening exercises, and flashcards — in 15+ languages."
    />
    <meta name="twitter:image" content="https://livelingo.uz/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "LiveLingo",
        "url": "https://livelingo.uz",
        "logo": "https://livelingo.uz/favicon.svg",
        "sameAs": ["https://t.me/livelingobot"]
      }
    </script>

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Google Identity Services — loads asynchronously so it doesn't
         block first paint. SignIn page polls window.google to know
         when it's ready. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
